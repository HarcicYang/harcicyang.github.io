<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#e8ecf1" media="(prefers-color-scheme: light)">
    <title>Harcic ' Songs</title>
    <script src="https://harcic.is-a.dev/jsmediatags.js"></script>
    <style>
        :root {
            --accent-r: 25; --accent-g: 73; --accent-b: 133;
            --primary-color: rgba(var(--accent-r, 56), var(--accent-g, 130), var(--accent-b, 235), 0.88);
            --primary-glow: rgba(var(--accent-r, 56), var(--accent-g, 130), var(--accent-b, 235), 0.65);
            --bg-card: rgba(24, 25, 27, 0.7);
            --bg-card-alt: rgba(24, 25, 27, 0.85);
            --text-primary: rgba(255, 255, 255, 0.78);
            --text-secondary: rgba(255, 255, 255, 0.42);
            --error-color: #ff6b6b;
            --shadow-color: rgba(24, 25, 27, 0.55);
            --transition-speed: 0.25s;
            --overlay: rgba(0, 0, 0, 0.55);
            --bg-image: url("/resource/backgrounds/13.webp");
            --glow-card: 0 0 12px 5px var(--shadow-color), 0 0 40px rgba(var(--accent-r, 56), var(--accent-g, 130), var(--accent-b, 235), 0.05);
            --glow-card-hover: 0 0 22px 10px var(--shadow-color), 0 0 60px rgba(var(--accent-r, 56), var(--accent-g, 130), var(--accent-b, 235), 0.12), 0 8px 24px rgba(0,0,0,0.2);
            --glow-btn: 0 0 14px 5px var(--primary-glow), 0 0 30px rgba(var(--accent-r, 56), var(--accent-g, 130), var(--accent-b, 235), 0.1);
            --glow-btn-hover: 0 0 22px 10px var(--primary-glow), 0 0 50px rgba(var(--accent-r, 56), var(--accent-g, 130), var(--accent-b, 235), 0.2);
        }

        [data-theme="light"] {
            --primary-glow: rgba(var(--accent-r, 56), var(--accent-g, 130), var(--accent-b, 235), 0.42);
            --bg-card: rgba(255, 255, 255, 0.72);
            --bg-card-alt: rgba(255, 255, 255, 0.88);
            --text-primary: rgba(24, 25, 27, 0.78);
            --text-secondary: rgba(24, 25, 27, 0.42);
            --shadow-color: rgba(180, 190, 210, 0.55);
            --overlay: rgba(255, 255, 255, 0.45);
        }

        [data-theme="light"] body { background: none; }

        .theme-toggle {
            position: fixed; top: 1rem; right: 1rem; z-index: 1000;
            width: 42px; height: 42px; border-radius: 50%; border: 0;
            background: var(--bg-card); color: var(--text-primary); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 12px 5px var(--shadow-color);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            transition: transform 0.2s;
        }
        .theme-toggle:hover { transform: scale(1.14) rotate(20deg); }
        .theme-toggle svg { width: 22px; height: 22px; fill: currentColor; }
        .theme-toggle.burst {
            animation: toggleBurst 0.6s ease-out;
        }
        @keyframes toggleBurst {
            0%   { box-shadow: 0 0 0 0 rgba(var(--accent-r, 56), var(--accent-g, 130), var(--accent-b, 235), 0.6); }
            100% { box-shadow: 0 0 40px 25px transparent; }
        }

        .back-btn {
            position: fixed; top: 1rem; left: 1rem; z-index: 1000;
            display: inline-flex; align-items: center; gap: 0.4rem;
            padding: 0.45rem 1.15rem; font-size: 0.9rem;
            border-radius: 9999px; border: 0;
            background: var(--bg-card); color: var(--text-primary);
            cursor: pointer; text-decoration: none;
            box-shadow: 0 0 12px 5px var(--shadow-color);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            will-change: transform;
            transition: transform var(--transition-speed);
        }
        .back-btn:hover { transform: translateY(-3px); }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: "Segoe UI", system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-primary);
            position: relative;
            height: 100vh;
            height: 100dvh;
            background: #0a0a0a;
        }
        [data-theme="light"] body { background: #e8ecf1; }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            min-height: 100vh; min-height: 100dvh;
            z-index: -1;
            pointer-events: none;
            will-change: transform;
            background: linear-gradient(var(--overlay), var(--overlay)), var(--bg-image) center center / cover no-repeat;
            background-color: #0a0a0a;
        }
        [data-theme="light"] body::before { background-color: #e8ecf1; }

        /* playing state: heavier blur + darker overlay from cover art */
        [data-playing] body::before {
            filter: blur(24px) brightness(0.35);
        }
        [data-playing][data-theme="light"] body::before {
            filter: blur(24px) brightness(0.55);
        }

        .main-container {
            display: flex;
            gap: 2rem;
            max-width: 1200px;
            width: 95%;
            height: 85vh;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 1;
        }

        .playlist-container {
            background: var(--bg-card);
            padding: 1.25rem;
            border-radius: 12px;
            flex: 0 0 280px;
            max-height: 80vh;
            overflow-y: hidden;
            align-self: center;
            box-shadow: var(--glow-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            will-change: transform;
            transition: transform var(--transition-speed), box-shadow var(--transition-speed);
        }

        .playlist {
            list-style: none;
            scrollbar-width: thin;
            scrollbar-color: var(--primary-color) transparent;
            overflow-y: scroll;
            height: 45vh;
            padding: 0;
            margin: 0;
        }
        .playlist::-webkit-scrollbar { width: 6px; }
        .playlist::-webkit-scrollbar-track { background: transparent; border-radius: 4px; }
        .playlist::-webkit-scrollbar-thumb { background: var(--primary-color); border-radius: 4px; }

        .playlist-item {
            padding: 0.65rem 0.75rem;
            border-radius: 8px;
            margin-bottom: 0.35rem;
            background: var(--bg-card-alt);
            cursor: pointer;
            will-change: transform;
            transition: transform var(--transition-speed), box-shadow var(--transition-speed);
            color: var(--text-secondary);
        }
        .playlist-item:hover {
            transform: translateY(-3px);
            box-shadow: var(--glow-card);
            color: var(--text-primary);
        }
        .playlist-item.active {
            background: var(--primary-color);
            color: #fff;
            box-shadow: var(--glow-btn);
        }
        .playlist-item h4 { margin: 0 0 0.15rem; color: currentColor; font-size: 0.95rem; font-weight: 500; }
        .playlist-item p { margin: 0; font-size: 0.8rem; opacity: 0.8; }

        .player-container {
            background: var(--bg-card);
            padding: 1.25rem;
            border-radius: 12px;
            flex: 1;
            box-shadow: var(--glow-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            position: relative;
            display: flex;
            gap: 1.5rem;
            align-self: center;
            will-change: transform;
            transition: transform var(--transition-speed), box-shadow var(--transition-speed);
        }

        .player-main {
            flex: 1;
            max-width: 50%;
        }

        .cover-art {
            width: 9rem;
            height: 9rem;
            object-fit: cover;
            border-radius: 12px;
            margin: 0 auto 1.25rem;
            display: block;
            background: #3b4141;
            box-shadow: var(--glow-card);
            will-change: transform;
            transition: transform var(--transition-speed), box-shadow var(--transition-speed);
        }
        .cover-art:hover {
            transform: translateY(-4px) scale(1.03);
            box-shadow: 0 0 22px 8px var(--shadow-color);
        }

        .song-info {
            text-align: center;
            margin-bottom: 1rem;
        }

        #title {
            font-size: 1.4rem;
            margin: 0 0 0.4rem;
            color: var(--primary-color);
            word-break: break-word;
            line-height: 1.3;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        #artist, #album { margin: 0.2rem 0; color: var(--text-secondary); font-size: 0.9em; }

        .controls {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        button {
            padding: 12px;
            border-radius: 50%;
            min-width: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--primary-color);
            border: 0;
            color: #fff;
            cursor: pointer;
            box-shadow: var(--glow-btn);
            will-change: transform;
            transition: transform var(--transition-speed), box-shadow var(--transition-speed);
            position: relative;
            overflow: hidden;
        }
        button::after {
            content: "";
            position: absolute;
            top: 0; left: -100%;
            width: 60%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            transform: skewX(-20deg);
            transition: left 0.5s ease;
            pointer-events: none;
        }
        button:hover:not(:disabled)::after { left: 120%; }
        button:hover:not(:disabled) {
            transform: translateY(-2px) scale(1.08);
            box-shadow: var(--glow-btn-hover);
        }
        button:disabled { opacity: 0.5; cursor: not-allowed; box-shadow: none; }
        button:disabled::after { display: none; }

        .icon-container { position: relative; width: 24px; height: 24px; z-index: 1; }
        .icon-pause, .icon-play { position: absolute; left: 0; top: 0; opacity: 0; transition: opacity 0.15s; }
        .icon-play { opacity: 1; }
        button.playing .icon-play { opacity: 0; }
        button.playing .icon-pause { opacity: 1; }

        #progress {
            flex: 1;
            height: 4px;
            accent-color: var(--primary-color);
            -webkit-appearance: none;
            appearance: none;
            outline: none;
            cursor: pointer;
            border-radius: 2px;
            background: var(--bg-card-alt);
        }
        #progress::-webkit-slider-runnable-track {
            height: 4px;
            border-radius: 2px;
            background: var(--bg-card-alt);
        }
        #progress::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 14px; height: 14px; border-radius: 50%;
            background: var(--primary-color);
            box-shadow: 0 0 8px 3px var(--primary-glow);
            cursor: pointer;
            margin-top: -5px;
        }
        #progress::-moz-range-track {
            height: 4px;
            border-radius: 2px;
            background: var(--bg-card-alt);
            border: 0;
        }
        #progress::-moz-range-thumb {
            width: 14px; height: 14px; border-radius: 50%;
            background: var(--primary-color);
            box-shadow: 0 0 8px 3px var(--primary-glow);
            border: 0;
            cursor: pointer;
        }
        #progress::-moz-range-progress {
            height: 4px;
            border-radius: 2px;
            background: var(--primary-color);
        }

        .time-display {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-top: 0.4rem;
        }

        .error-message {
            color: var(--error-color);
            text-align: center;
            margin: 0.75rem 0;
            padding: 0.6rem;
            background: var(--bg-card-alt);
            border-radius: 8px;
            display: none;
            box-shadow: var(--glow-card);
        }
        .loading-indicator { display: none; text-align: center; color: var(--text-secondary); margin: 0.75rem 0; }
        .loading-indicator::before {
            content: '';
            display: inline-block;
            width: 18px; height: 18px;
            border: 2px solid rgba(127,127,127,0.2);
            border-top-color: var(--primary-color);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
            margin-right: 0.5rem;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .lyrics-container {
            flex: 1;
            min-width: 0;
            padding: 1rem;
            border-radius: 8px;
            max-height: 24rem;
            display: flex;
            flex-direction: column;
            overflow-y: hidden;
            background: var(--bg-card-alt);
            box-shadow: var(--glow-card);
        }
        .lyrics-content {
            color: var(--text-secondary);
            white-space: pre-line;
            line-height: 1.7;
            font-size: 0.9em;
            padding-right: 10px;
            overflow-y: scroll;
            scrollbar-width: thin;
            scrollbar-color: var(--primary-color) transparent;
            flex-grow: 1;
        }
        .lyrics-content::-webkit-scrollbar { width: 6px; }
        .lyrics-content::-webkit-scrollbar-thumb { background: var(--primary-color); border-radius: 4px; }

        .lyrics-title {
            color: var(--text-primary);
            margin: 0 0 0.75rem;
            padding-bottom: 0.4rem;
            border-bottom: 1px solid var(--text-secondary);
            font-weight: 600;
        }
        .lyrics-line.active {
            color: var(--primary-color) !important;
            font-weight: 500;
        }

        @media (max-width: 1024px) {
            .main-container { flex-direction: column; height: auto; padding: 1rem; gap: 1rem; width: 100%; max-width: 100%; overflow-y: auto; height: 100vh; }
            .playlist-container { width: 95%; flex: none; max-height: 20vh; padding: 1rem; margin-top: -20px; }
            .playlist { height: 15vh; }
            .player-container { width: 95%; flex-direction: row; padding: 1rem; gap: 1rem; flex: none; }
            .player-main { max-width: 60%; flex: 1; }
            .lyrics-container { flex: 1; min-width: 0; max-height: 38vh; padding: 1rem; }
            .cover-art { width: 8rem; height: 8rem; margin: 0 auto 0.75rem; }
            #title { font-size: 1.2rem; }
            .lyrics-content { height: 32vh; font-size: 0.85em; }
        }
        @media (max-width: 768px) {
            .main-container { gap: 0.75rem; }
            .player-container { flex-direction: column; padding: 1rem; gap: 1rem; }
            .playlist-container { max-height: 17vh; margin-top: -20px; }
            .player-main { max-width: 100%; width: 100%; }
            .lyrics-container { width: 100%; max-height: 22vh; }
            .cover-art { width: 8rem; height: 8rem; }
            #title { font-size: 1.15rem; }
            .playlist-container { max-height: 20vh; }
            .playlist { height: 14vh; }
            .lyrics-content { height: 17vh; }
        }
        @media (max-width: 480px) {
            .main-container { width: 100%; padding: 0.5rem; gap: 0.5rem; }
            .playlist-container, .player-container { width: 100%; padding: 0.75rem; }
            .playlist-container { max-height: 17vh; margin-top: -20px; }
            .cover-art { width: 7rem; height: 7rem; }
            #title { font-size: 1.05rem; }
            .playlist { height: 12vh; }
            .lyrics-container { max-height: 18vh; }
            .lyrics-content { height: 14vh; font-size: 0.82em; }
            .controls { gap: 0.5rem; }
            button { padding: 9px; }
            .icon-container { width: 22px; height: 22px; }
            #progress { height: 3px; }
            #progress::-webkit-slider-thumb { width: 1.2rem; height: 1.2rem; }
        }

    </style>
</head>
<body>
    <a href="/" class="back-btn" title="返回首页">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M21 11H6.414l5.293-5.293-1.414-1.414L2.586 12l7.707 7.707 1.414-1.414L6.414 13H21z"/></svg>
        首页
    </a>

    <button class="theme-toggle" id="themeToggle" aria-label="切换主题">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="currentColor"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 00-1.41 0 .996.996 0 000 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 00-1.41 0 .996.996 0 000 1.41l1.06 1.06c.39.39 1.03.39 1.41 0a.996.996 0 000-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 000-1.41.996.996 0 00-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 000-1.41.996.996 0 00-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M12 3a9 9 0 109 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 01-4.4 2.26 5.403 5.403 0 01-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
    </button>

    <div class="main-container">
        <div class="playlist-container">
            <h3 style="color: var(--text-color); font-size: var(--body-size,0.9rem); font-weight:600; margin:5px; padding-left:0.25rem;">播放列表</h3>
            <ul class="playlist" id="playlist"></ul>
        </div>

        <div class="player-container">
            <div class="player-main">
                <img id="coverArt" class="cover-art" alt="" src="block.png">
                <div class="song-info">
                    <h2 id="title">选择曲目开始播放</h2>
                    <p id="artist">&ndash;</p>
                    <p id="album">&ndash;</p>
                </div>
                <div class="loading-indicator">正在加载音频文件&hellip;</div>
                <div class="error-message" id="errorMsg"></div>
                <div class="controls">
                    <button id="playPauseBtn" disabled aria-label="播放">
                        <div class="icon-container">
                            <svg class="icon icon-play" viewBox="0 0 24 24" fill="rgba(255,255,255,0.9)">
                                <path d="M8 5v14l11-7z"/>
                            </svg>
                            <svg class="icon icon-pause" viewBox="0 0 24 24" fill="rgba(255,255,255,0.9)">
                                <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                            </svg>
                        </div>
                    </button>
                    <input type="range" id="progress" value="0" min="0" max="100" step="0.1" disabled>
                </div>
                <div class="time-display">
                    <span id="currentTime">0:00</span>
                    <span id="duration">0:00</span>
                </div>
            </div>

            <div class="lyrics-container">
                <h3 style="color: var(--text-color); font-size: var(--body-size,0.9rem); font-weight:600; margin:5px; padding-left:0.25rem;">歌词</h3>
                <div id="lyrics" class="lyrics-content">暂无歌词</div>
            </div>
        </div>
    </div>

    <script>
        const state = {
            audio: null,
            isPlaying: false,
            currentTrackIndex: -1,
            playlist: [],
            lastProcessedImage: null // 防止重复处理同一张图片
        };

        // 动态颜色提取函数
        function getDominantColor(imageElement) {
            return new Promise((resolve, reject) => {
                try {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    canvas.width = 50;
                    canvas.height = 50;
                    
                    // 确保图片已加载
                    if (!imageElement.complete || imageElement.naturalHeight === 0) {
                        reject(new Error('Image not loaded'));
                        return;
                    }
                    
                    ctx.drawImage(imageElement, 0, 0, 50, 50);
                    
                    const imageData = ctx.getImageData(0, 0, 50, 50).data;
                    let r = 0, g = 0, b = 0;
                    let count = 0;
                    
                    // 采样像素
                    for (let i = 0; i < imageData.length; i += 16) {
                        r += imageData[i];
                        g += imageData[i + 1];
                        b += imageData[i + 2];
                        count++;
                    }
                    
                    // 计算平均颜色
                    r = Math.floor(r / count);
                    g = Math.floor(g / count);
                    b = Math.floor(b / count);
                    
                    resolve([r, g, b]);
                } catch (error) {
                    reject(error);
                }
            });
        }

        // 应用动态颜色到背景和强调色
        function applyDynamicColors(rgb, imgSrc) {
            const [r, g, b] = rgb;
            var s = document.documentElement.style;
            s.setProperty("--bg-image", "url(" + imgSrc + ")");
            s.setProperty("--accent-r", r);
            s.setProperty("--accent-g", g);
            s.setProperty("--accent-b", b);
            s.setProperty("--accent-r2", Math.min(255, r + 30));
            s.setProperty("--accent-g2", Math.min(255, g + 30));
            s.setProperty("--accent-b2", Math.min(255, b + 30));
            document.documentElement.setAttribute("data-playing", "true");
        }

        // 重置为随机背景
        function resetBackgroundColors() {
            document.documentElement.removeAttribute("data-playing");
            if (typeof loadBg === "function") loadBg();
        }

        async function initPlayer() {
            const urlParam = getSafeAudioUrl();
            const indexParam = getIndex();

            try {
                state.playlist = await loadPlaylist("./list.json");

                if (urlParam) {
                    state.playlist.unshift({
                        url: urlParam,
                        title: '来自URL的歌曲',
                        artist: ' - ',
                        album: ' - '
                    });
                    state.currentTrackIndex = 0;
                } else if (indexParam >= 0 && indexParam < state.playlist.length) {
                    state.currentTrackIndex = indexParam;
                } else if (state.playlist.length > 0) {
                    state.currentTrackIndex = 0;
                }

                renderPlaylist();
                if (state.currentTrackIndex >= 0) {
                    await loadTrack(state.currentTrackIndex);
                }
            } catch (error) {
                console.error('初始化播放器失败:', error);
                showError(`初始化失败: ${error.message}`);
            }
        }

        async function loadPlaylist(url) {
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error(`HTTP错误 ${response.status}`);
                return await response.json();
            } catch (error) {
                throw new Error(`播放列表加载失败: ${error.message}`);
            }
        }

        function renderPlaylist() {
            const listElement = document.getElementById('playlist');
            listElement.innerHTML = state.playlist.map((track, index) => `
                    <li class="playlist-item ${index === state.currentTrackIndex ? 'active' : ''}"
                        data-index="${index}">
                        <h4>${track.title}</h4>
                        <p>${track.artist}</p>
                    </li>
                `).join('');

            document.querySelectorAll('.playlist-item').forEach(item => {
                item.addEventListener('click', async () => {
                    const index = parseInt(item.dataset.index);
                    if (index === state.currentTrackIndex) return;
                    window.location.search = `?index=${index}`;
                });
            });

            if (state.currentTrackIndex > -1) {
                requestAnimationFrame(() => {
                    const activeItem = listElement.querySelector(`[data-index="${state.currentTrackIndex}"]`);
                    if (activeItem) {
                        // 计算滚动位置
                        const container = listElement.parentElement;
                        const itemTop = activeItem.offsetTop;
                        const itemHeight = activeItem.offsetHeight;
                        const containerHeight = container.clientHeight;

                        // 居中滚动（带边界检测）
                        const targetScroll = Math.max(0, itemTop - (containerHeight - itemHeight)/2);

                        // 使用平滑滚动
                        container.scrollTo({
                            top: targetScroll,
                            behavior: 'auto'
                        });
                    }
                });
            }
        }

        async function loadTrack(index) {
            // 验证索引范围
            if (index < 0 || index >= state.playlist.length) {
                showError('无效的曲目索引');
                return;
            }
            
            const track = state.playlist[index];
            showLoading(true);

            try {
                // 停止当前播放的音频
                if (state.audio) {
                    state.audio.pause();
                    state.audio.removeEventListener('timeupdate', updateProgress);
                    state.audio = null;
                }

                state.audio = new Audio(track.url);
                state.audio.crossOrigin = "anonymous";
                setupAudioEvents();

                // 使用 Promise.race 添加超时处理
                const metadataPromise = new Promise((resolve, reject) => {
                    fetch(track.url)
                        .then(response => {
                            if (!response.ok) {
                                throw new Error(`HTTP error ${response.status}`);
                            }
                            return response.blob();
                        })
                        .then(blob => {
                            jsmediatags.read(blob, {
                                onSuccess: tag => {
                                    updateMetadata(tag.tags, index);
                                    resolve();
                                },
                                onError: (error) => {
                                    console.warn('Failed to read media tags:', error);
                                    updateMetadata({}, index);
                                    resolve(); // 即使元数据读取失败也继续
                                }
                            });
                        })
                        .catch(error => {
                            console.error('Fetch error:', error);
                            updateMetadata({}, index);
                            resolve(); // 即使获取失败也继续
                        });
                });

                // 设置超时
                const timeoutPromise = new Promise((resolve) => {
                    setTimeout(resolve, 10000); // 10秒超时
                });

                await Promise.race([metadataPromise, timeoutPromise]);

                // 加载歌词
                try {
                    if (track.lyrics) {
                        const response = await fetch(track.lyrics);
                        if (response.ok) {
                            const lyricsText = await response.text();
                            const parsedLyrics = parseLyrics(lyricsText);
                            document.getElementById('lyrics').innerHTML = formatLyrics(parsedLyrics);
                            document.querySelector('.lyrics-content').scrollTo(0, 0);
                        } else {
                            document.getElementById('lyrics').innerHTML = '<span style="opacity:0.7">暂无歌词</span>';
                        }
                    } else {
                        document.getElementById('lyrics').innerHTML = '<span style="opacity:0.7">暂无歌词</span>';
                    }
                } catch (error) {
                    console.error('Lyrics loading error:', error);
                    document.getElementById('lyrics').innerHTML = '<span style="color:#ff6b6b">歌词加载失败</span>';
                }

                enableControls();
                renderPlaylist(); // 更新播放列表高亮
                
            } catch (error) {
                console.error('Track loading error:', error);
                showError(`加载失败: ${error.message}`);
            } finally {
                showLoading(false);
            }
        }

        function formatLyrics(lyricData) {
            return lyricData.map(item => {
                if (item.time === null) {
                    return `<div class="lyrics-line">${item.text}</div>`;
                }
                return `<div class="lyrics-line" data-time="${item.time.toFixed(2)}">${item.text}</div>`;
            }).join('');
        }

        const timeRegex = /\[\s*(\d+)\s*:\s*(\d+)(?:[.:](\d+))?\s*\]/g;

        function parseLyrics(text) {
            const lines = text.split('\n');
            const lyricData = [];

            lines.forEach(line => {
                // 提取所有时间标签
                const timeTags = [];
                let cleanLine = line;
                let match;

                // 使用更强大的正则匹配并保存替换结果
                cleanLine = line.replace(timeRegex, (match, m, s, ms) => {
                    const minutes = parseInt(m, 10);
                    const seconds = parseInt(s, 10);
                    const milliseconds = ms ? parseInt(ms.padEnd(2, '0'), 10) : 0;

                    const totalTime = minutes * 60 + seconds + milliseconds / 100;
                    timeTags.push(totalTime);
                    return '';
                }).trim();

                // 处理有效歌词行
                if (cleanLine && timeTags.length > 0) {
                    timeTags.forEach(time => {
                        lyricData.push({time, text: cleanLine});
                    });
                } else if (cleanLine) {
                    lyricData.push({time: null, text: cleanLine});
                }
            });

            // 按时间排序并合并重复
            return lyricData.sort((a, b) => (a.time || 0) - (b.time || 0))
                .filter((item, index, arr) => {
                    return index === 0 || item.time !== arr[index - 1].time;
                });
        }

        let lastHighlighted = null;

        function updateLyricsHighlight(currentTime) {
            const lines = document.querySelectorAll('.lyrics-line[data-time]');
            let currentLine = null;

            // 逆序查找第一个小于当前时间的行
            for (let i = lines.length - 1; i >= 0; i--) {
                const lineTime = parseFloat(lines[i].dataset.time);
                if (lineTime <= currentTime) {
                    currentLine = lines[i];
                    break;
                }
            }

            if (currentLine !== lastHighlighted) {
                // 移除旧高亮
                if (lastHighlighted) {
                    lastHighlighted.classList.remove('active');
                }

                // 设置新高亮
                if (currentLine) {
                    currentLine.classList.add('active');

                    // 自动滚动逻辑
                    const container = document.querySelector('.lyrics-content');
                    const lineTop = currentLine.offsetTop;
                    const lineHeight = currentLine.offsetHeight;
                    const containerHeight = container.clientHeight;
                    
                    if (lineTop) {
                        container.scrollTo({
                            top: lineTop - containerHeight / 2 + lineHeight / 2 + lineHeight,
                            behavior: 'smooth'
                        });
                    }
                }

                lastHighlighted = currentLine;
            }
        }

        function updateMetadata(tags, index) {
            const track = state.playlist[index];
            
            // 添加安全检查，确保 track 存在
            if (!track) {
                console.error('Track not found at index:', index);
                return;
            }
            
            // 更新元数据
            track.title = tags.title || track.url.split('/').pop().replace(/\.[^.]+$/, '');
            track.artist = tags.artist || '未知艺术家';
            track.album = tags.album || '未知专辑';

            // 更新 DOM 显示
            document.getElementById('title').textContent = track.title;
            document.getElementById('artist').textContent = track.artist;
            document.getElementById('album').textContent = track.album;

            // 处理专辑封面
            if (tags.picture) {
                try {
                    const base64 = btoa(String.fromCharCode(...new Uint8Array(tags.picture.data)));
                    const imgSrc = `data:${tags.picture.format};base64,${base64}`;
                    const coverArt = document.getElementById('coverArt');
                    
                    // 防止重复处理同一张图片
                    if (state.lastProcessedImage === imgSrc) {
                        return;
                    }
                    state.lastProcessedImage = imgSrc;
                    
                    // 添加图片加载错误处理
                    coverArt.onerror = function() {
                        console.error('Failed to load cover art');
                        coverArt.src = 'block.png';
                        resetBackgroundColors();
                    };
                    
                    coverArt.onload = function() {
                        getDominantColor(coverArt).then(rgb => {
                            applyDynamicColors(rgb, imgSrc);
                        }).catch(error => {
                            console.error('Error extracting dominant color:', error);
                            resetBackgroundColors();
                        });
                    };
                    
                    coverArt.src = imgSrc;
                    
                } catch (error) {
                    console.error('Error processing cover art:', error);
                    document.getElementById('coverArt').src = 'block.png';
                    resetBackgroundColors();
                }
            } else {
                document.getElementById('coverArt').src = 'block.png';
                resetBackgroundColors();
            }
        }

        // 添加进度更新函数
        function updateProgress() {
            if (!state.audio) return;
            
            const progress = document.getElementById('progress');
            const currentTime = document.getElementById('currentTime');
            
            if (state.audio.duration && !isNaN(state.audio.duration)) {
                progress.value = (state.audio.currentTime / state.audio.duration) * 100 || 0;
                currentTime.textContent = formatTime(state.audio.currentTime);
                updateLyricsHighlight(state.audio.currentTime);
            }
        }

        function setupAudioEvents() {
            const audio = state.audio;
            if (!audio) return;

            // 移除可能存在的旧事件监听器
            audio.removeEventListener('timeupdate', updateProgress);
            
            document.getElementById('playPauseBtn').addEventListener('click', () => {
                if (state.isPlaying) {
                    audio.pause();
                } else {
                    audio.play().catch(error => {
                        console.error('Playback failed:', error);
                        showError(`播放失败: ${error.message}`);
                    });
                }
                state.isPlaying = !state.isPlaying;
                updatePlayButton();
            });

            audio.addEventListener('timeupdate', updateProgress);

            document.getElementById('progress').addEventListener('input', (e) => {
                if (audio.duration && !isNaN(audio.duration)) {
                    audio.currentTime = (e.target.value / 100) * audio.duration;
                }
            });

            audio.addEventListener('loadedmetadata', () => {
                document.getElementById('duration').textContent = formatTime(audio.duration);
            });

            audio.addEventListener('error', (e) => {
                const errorCode = audio.error ? `MEDIA_ERR_${audio.error.code}` : '未知错误';
                showError(`音频错误: ${errorCode}`);
                disableControls();
            });

            audio.addEventListener('ended', () => {
                state.isPlaying = false;
                updatePlayButton();
            });
        }

        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const minutes = Math.floor(seconds / 60);
            seconds = Math.floor(seconds % 60);
            return `${minutes}:${seconds.toString().padStart(2, '0')}`;
        }

        function updatePlayButton() {
            const btn = document.getElementById('playPauseBtn');
            btn.classList.toggle('playing', state.isPlaying);
            btn.setAttribute('aria-label', state.isPlaying ? '暂停' : '播放');
        }

        function enableControls() {
            document.getElementById('playPauseBtn').disabled = false;
            document.getElementById('progress').disabled = false;
        }

        function disableControls() {
            document.getElementById('playPauseBtn').disabled = true;
            document.getElementById('progress').disabled = true;
        }

        function showLoading(show) {
            document.querySelector('.loading-indicator').style.display =
                show ? 'block' : 'none';
        }

        function showError(message) {
            const errorElement = document.getElementById('errorMsg');
            errorElement.textContent = message;
            errorElement.style.display = 'block';
            disableControls();
        }

        function getSafeAudioUrl() {
            try {
                const params = new URLSearchParams(window.location.search);
                return params.get('url') || null;
            } catch {
                return null;
            }
        }

        function getIndex() {
            try {
                const params = new URLSearchParams(window.location.search);
                const index = params.get('index');
                if (index) {
                    return Number(index);
                }
            } catch {
                return -1;
            }
        }

        (async () => {
            try {
                await initPlayer();
            } catch (error) {
                console.error('初始化错误:', error);
                if (state.playlist.length === 0) {
                    document.getElementById('errorMsg').style.display = 'none';
                }
            }
        })();

        (function() {
            const toggle = document.getElementById("themeToggle");
            const sunIcon = toggle.querySelector(".icon-sun");
            const moonIcon = toggle.querySelector(".icon-moon");
            const saved = localStorage.getItem("theme") || "dark";
            document.documentElement.setAttribute("data-theme", saved);
            if (saved === "light") {
                sunIcon.style.display = "none";
                moonIcon.style.display = "";
            }
            toggle.addEventListener("click", () => {
                const cur = document.documentElement.getAttribute("data-theme");
                const next = cur === "light" ? "dark" : "light";
                document.documentElement.setAttribute("data-theme", next);
                localStorage.setItem("theme", next);
                sunIcon.style.display = next === "light" ? "none" : "";
                moonIcon.style.display = next === "light" ? "" : "none";
                toggle.classList.add("burst");
                setTimeout(() => toggle.classList.remove("burst"), 600);
            });
        })();

        var loadBg = function() {
            var style = document.documentElement.style;
            fetch("/resource/backgrounds/list.json")
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    var list = data.backgrounds;
                    if (list && list.length) {
                        var pick = list[Math.floor(Math.random() * list.length)];
                        style.setProperty("--bg-image", "url('/resource/backgrounds/" + pick.file + "')");
                        if (pick.accent && pick.accent.length === 3) {
                            var r = pick.accent[0], g = pick.accent[1], b = pick.accent[2];
                            style.setProperty("--accent-r", r);
                            style.setProperty("--accent-g", g);
                            style.setProperty("--accent-b", b);
                            style.setProperty("--accent-r2", Math.min(255, r + 30));
                            style.setProperty("--accent-g2", Math.min(255, g + 30));
                            style.setProperty("--accent-b2", Math.min(255, b + 30));
                        }
                    }
                })
                .catch(function() {
                    style.setProperty("--bg-image", "url('/resource/backgrounds/13.webp')");
                });
        };
        loadBg();
        window.addEventListener("pageshow", function(e) { if (e.persisted) loadBg(); });
    </script>
</body>
