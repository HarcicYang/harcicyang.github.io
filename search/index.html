<!DOCTYPE html>
<html lang="zh" class="rcitrat-preview">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#e8ecf1" media="(prefers-color-scheme: light)">
    <title>Rcitrat - Search</title>
    <link rel="icon" type="image/svg+xml" href="/resource/favicon.svg">
    <link rel="stylesheet" href="/resource/theme.css?v=rcitrat-site-27">
    <style>
        body {
            overflow: hidden;
            height: 100vh;
            height: 100dvh;
            padding: 0;
            justify-content: center;
            align-items: center;
        }
        .search-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .logo-block { margin: 0 0 1.2rem 0; }
        .logo-block svg { display: block; width: 160px; height: 160px; }
        .logo-main { fill: var(--logo-color); }
        .logo-sub { fill: var(--logo-sub-color); }

        .search-box {
            display: flex;
            align-items: center;
            width: 520px;
            max-width: 90vw;
            height: 48px;
            border-radius: 9999px;
            background: var(--box-color);
            box-shadow: var(--shadow-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            margin-bottom: 1.2rem;
            transition: box-shadow 0.3s;
        }
        .search-box:focus-within {
            box-shadow:
                0 0 8px 2px var(--ac-btn-shadow-color),
                0 0 28px 8px rgba(var(--accent-r), var(--accent-g), var(--accent-b), 0.18);
        }
        .search-ipt {
            flex: 1;
            height: 100%;
            padding: 0 1.2rem;
            font-size: 1rem;
            color: var(--text-color);
            background: none;
            border: 0;
            outline: none;
        }
        .search-ipt::placeholder { opacity: 0.4; }
        .search-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 46px;
            height: 34px;
            margin-right: 7px;
            border: 0;
            border-radius: 9999px;
            background: var(--ac-btn-color);
            color: var(--btn-text-color);
            cursor: pointer;
            box-shadow: var(--shadow-btn);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            will-change: transform;
            transition: transform 0.2s, box-shadow 0.2s;
            flex-shrink: 0;
        }
        .search-btn:hover { transform: scale(1.1); box-shadow: 0 0 15px 8px var(--ac-btn-shadow-color-l); }
        .search-btn svg { width: 18px; height: 18px; fill: var(--btn-text-color); }

        .pin-container {
            display: flex;
            flex-wrap: nowrap;
            overflow-x: auto;
            overflow-y: hidden;
            align-items: center;
            max-width: min(600px, 90vw);
            max-height: 120px;
            padding: 0.4rem;
            border-radius: var(--radius-lg);
            background: var(--box-color);
            box-shadow: 0 0 12px 5px var(--box-shadow-color);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            scrollbar-width: thin;
            scrollbar-color: var(--ac-btn-color) transparent;
            gap: 0.15rem;
            -webkit-overflow-scrolling: touch;
        }
        .pin-container::-webkit-scrollbar { height: 4px; }
        .pin-container::-webkit-scrollbar-thumb { background: var(--ac-btn-color); border-radius: 4px; }
        .pin-container::-webkit-scrollbar-track { background: transparent; }

        pin-item {
            display: flex;
            flex: 0 0 auto;
            align-self: center;
        }

        @keyframes fadeout {
            from { transform: scale(1); opacity: 1; }
            to { transform: scale(0.8); opacity: 0; }
        }
        .fade { animation: fadeout 0.6s forwards; }

        @media (max-width: 768px) {
            .logo-block svg { width: 120px; height: 120px; }
            .search-box { height: 46px; }
            .search-ipt { font-size: 0.95rem; }
            .search-btn { width: 40px; height: 30px; }
        }
    </style>
    <script>
        function getDomainFromUrl(url) {
            try { return new URL(url).hostname; } catch { return ""; }
        }
        class PinItem extends HTMLElement {
            connectedCallback() {
                var title = this.getAttribute("title"),
                    url = this.getAttribute("url"),
                    shadow = this.attachShadow({ mode: "open" }),
                    domain = getDomainFromUrl(url);
                shadow.innerHTML = '<style>:host{display:flex;flex-direction:column;align-items:center;flex:0 0 auto;width:104px;height:104px;margin:0;border-radius:12px;background:var(--hc-glass-2,var(--sub-box-color,rgba(24,25,27,0.85)));color:var(--hc-on,var(--text-color,#fff));-webkit-backdrop-filter:blur(8px) saturate(1.05);backdrop-filter:blur(8px) saturate(1.05);box-shadow:0 0 10px 2px color-mix(in oklab,var(--hc-glass-2,#252525) 78%,transparent),0 0 24px 5px color-mix(in oklab,var(--hc-glass-2,#252525) 20%,transparent);cursor:pointer;transition:transform .2s,background-color .2s,box-shadow .2s} :host(:hover),:host(:focus-visible){transform:translateY(-6px);background:var(--hc-glass-3,var(--sub-box-color,rgba(24,25,27,0.85)));box-shadow:0 0 10px 2px color-mix(in oklab,var(--hc-glass-3,#303030) 78%,transparent),0 0 28px 6px color-mix(in oklab,var(--hc-glass-3,#303030) 22%,transparent)} img{width:38px;height:38px;margin-top:14px;border-radius:8px} span{font-size:.8rem;margin-top:8px;text-align:center;max-width:92px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}</style><img src="https://'+domain+'/favicon.ico" onerror="this.remove()"><span>'+title+'</span>';
                this.addEventListener("click", function() { location.href = url; });
            }
        }
        customElements.define("pin-item", PinItem);
    </script>
    <link rel="stylesheet" href="/resource/rcitrat/tokens.css?v=rcitrat-site-27">
    <link rel="stylesheet" href="/resource/rcitrat/surfaces.css?v=rcitrat-site-27">
    <link rel="stylesheet" href="/resource/rcitrat/icons.css?v=rcitrat-site-27">
    <script src="/resource/rcitrat/color.js?v=rcitrat-site-27"></script>
</head>
<body>
    <a href="/" class="back-btn ic-host" title="返回首页">
        <hc-icon name="back"></hc-icon>
        首页
    </a>

    <button class="theme-toggle ic-host" id="themeToggle" aria-label="切换主题">
        <svg class="icon-sun" width="0" height="0" aria-hidden="true"></svg>
        <svg class="icon-moon" width="0" height="0" style="display:none" aria-hidden="true"></svg>
        <hc-icon name="theme"></hc-icon>
    </button>

    <div class="search-overlay">
        <div class="logo-block">
            <svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1920" viewBox="0 0 1920 1920">
                <defs><clipPath id="clip-LOGO"><rect width="1920" height="1920"/></clipPath></defs>
                <g clip-path="url(#clip-LOGO)">
                    <g transform="translate(127.376 68.102)">
                        <rect class="logo-main" width="150" height="1100" transform="translate(952.628 148.113) rotate(60)"/>
                        <rect class="logo-main" width="150" height="747" transform="translate(503.802 1271.921) rotate(150)"/>
                        <rect class="logo-main" width="150" height="1400" transform="translate(1659.528 1356.548) rotate(150)"/>
                        <rect class="logo-main" width="150" height="1400" transform="translate(1511.65 516.523) rotate(60)"/>
                        <rect class="logo-main" width="150" height="747" transform="translate(1589.725 646.921) rotate(150)"/>
                        <rect class="logo-sub" width="150" height="458.837" rx="75" transform="translate(1104.114 1166.766) rotate(60)"/>
                    </g>
                </g>
            </svg>
        </div>

        <div class="search-box" id="sb">
            <input class="search-ipt" type="text" id="searchInput" autocomplete="off" placeholder="搜索...">
            <button class="search-btn ic-host" id="searchBtn" aria-label="搜索">
                <hc-icon name="search"></hc-icon>
            </button>
        </div>

        <div class="pin-container" id="pin">
            <pin-item url="https://www.bilibili.com" title="BiliBili"></pin-item>
            <pin-item url="https://www.microsoft.com" title="Microsoft"></pin-item>
            <pin-item url="https://www.github.com" title="GitHub"></pin-item>
            <pin-item url="https://www.google.com" title="Google"></pin-item>
            <pin-item url="https://www.x.com" title="X"></pin-item>
            <pin-item url="https://aistudio.google.com" title="AIStudio"></pin-item>
            <pin-item url="https://harcicyang.github.io/sickof.html" title="发电"></pin-item>
        </div>
    </div>

    <script>
        var inp = document.getElementById("searchInput"),
            sb = document.getElementById("sb"),
            pin = document.getElementById("pin");
        function fadeAll() { sb.classList.add("fade"); pin.classList.add("fade"); }
        function goSearch() { fadeAll(); setTimeout(function() { location.href = "https://www.bing.com/search?q=" + encodeURIComponent(inp.value); }, 400); }
        inp.addEventListener("keypress", function(e) { if (e.key === "Enter") goSearch(); });
        document.getElementById("searchBtn").onclick = goSearch;
        pin.querySelectorAll("pin-item").forEach(function(p) { p.addEventListener("click", fadeAll); });
    </script>
    <script src="/resource/rcitrat/icons.js?v=rcitrat-site-27"></script>
    <script src="/resource/rcitrat/site.js?v=rcitrat-site-27"></script>
    <script src="/resource/theme.js?v=rcitrat-site-27"></script>
</body>
</html>
