<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#e8ecf1" media="(prefers-color-scheme: light)">
    <title>Rcitrat - Search</title>
    <link rel="icon" type="image/svg+xml" href="/resource/favicon.svg">
    <link rel="stylesheet" href="/resource/theme.css">
    <style>
        body {
            overflow: hidden;
            height: 100vh;
            height: 100dvh;
            padding: 0;
            justify-content: center;
            align-items: center;
        }
        .search-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .logo-block { margin: 0 0 1.2rem 0; }
        .logo-block svg { display: block; width: 160px; height: 160px; }
        .logo-main { fill: var(--logo-color); }
        .logo-sub { fill: var(--logo-sub-color); }

        .search-box {
            display: flex;
            align-items: center;
            width: 520px;
            max-width: 90vw;
            height: 48px;
            border-radius: 9999px;
            background: var(--box-color);
            box-shadow: var(--shadow-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            margin-bottom: 1.2rem;
            transition: box-shadow 0.3s;
        }
        .search-box:focus-within {
            animation: inputPulse 2s ease-in-out infinite;
        }
        @keyframes inputPulse {
            0%, 100% { box-shadow: 0 0 12px 8px var(--ac-btn-shadow-color), 0 0 30px rgba(var(--accent-r), var(--accent-g), var(--accent-b), 0.1); }
            50%      { box-shadow: 0 0 22px 15px var(--ac-btn-shadow-color), 0 0 50px rgba(var(--accent-r), var(--accent-g), var(--accent-b), 0.2); }
        }
        .search-ipt {
            flex: 1;
            height: 100%;
            padding: 0 1.2rem;
            font-size: 1rem;
            color: var(--text-color);
            background: none;
            border: 0;
            outline: none;
        }
        .search-ipt::placeholder { opacity: 0.4; }
        .search-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 46px;
            height: 34px;
            margin-right: 7px;
            border: 0;
            border-radius: 9999px;
            background: var(--ac-btn-color);
            color: var(--btn-text-color);
            cursor: pointer;
            box-shadow: var(--shadow-btn);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            will-change: transform;
            transition: transform 0.2s, box-shadow 0.2s;
            flex-shrink: 0;
        }
        .search-btn:hover { transform: scale(1.1); box-shadow: 0 0 15px 8px var(--ac-btn-shadow-color-l); }
        .search-btn svg { width: 18px; height: 18px; fill: var(--btn-text-color); }

        .pin-container {
            display: flex;
            flex-wrap: nowrap;
            overflow-x: auto;
            overflow-y: hidden;
            align-items: center;
            max-width: min(600px, 90vw);
            max-height: 120px;
            padding: 0.4rem;
            border-radius: var(--radius-lg);
            background: var(--box-color);
            box-shadow: 0 0 12px 5px var(--box-shadow-color);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            scrollbar-width: thin;
            scrollbar-color: var(--ac-btn-color) transparent;
            gap: 0.15rem;
            -webkit-overflow-scrolling: touch;
        }
        .pin-container::-webkit-scrollbar { height: 4px; }
        .pin-container::-webkit-scrollbar-thumb { background: var(--ac-btn-color); border-radius: 4px; }
        .pin-container::-webkit-scrollbar-track { background: transparent; }

        pin-item {
            display: flex;
            flex: 0 0 auto;
            align-self: center;
        }

        @keyframes fadeout {
            from { transform: scale(1); opacity: 1; }
            to { transform: scale(0.8); opacity: 0; }
        }
        .fade { animation: fadeout 0.6s forwards; }

        @media (max-width: 768px) {
            .logo-block svg { width: 120px; height: 120px; }
            .search-box { height: 46px; }
            .search-ipt { font-size: 0.95rem; }
            .search-btn { width: 40px; height: 30px; }
        }
    </style>
    <script>
        function getDomainFromUrl(url) {
            try { return new URL(url).hostname; } catch { return ""; }
        }
        class PinItem extends HTMLElement {
            connectedCallback() {
                var title = this.getAttribute("title"),
                    url = this.getAttribute("url"),
                    shadow = this.attachShadow({ mode: "open" }),
                    domain = getDomainFromUrl(url);
                shadow.innerHTML = '<style>:host{display:flex;flex-direction:column;align-items:center;flex:0 0 auto;width:100px;height:98px;margin:0 .15rem;border-radius:12px;background:var(--sub-box-color,rgba(24,25,27,0.85));cursor:pointer;transition:transform .2s} :host:hover{transform:translateY(-6px)} img{width:36px;height:36px;margin-top:12px;border-radius:8px} span{font-size:.75rem;margin-top:6px;text-align:center;max-width:88px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}</style><img src="https://'+domain+'/favicon.ico" onerror="this.remove()"><span>'+title+'</span>';
                this.addEventListener("click", function() { location.href = url; });
            }
        }
        customElements.define("pin-item", PinItem);
    </script>
</head>
<body>
    <a href="/" class="back-btn" title="返回首页">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M21 11H6.414l5.293-5.293-1.414-1.414L2.586 12l7.707 7.707 1.414-1.414L6.414 13H21z"/></svg>
        首页
    </a>

    <button class="theme-toggle" id="themeToggle" aria-label="切换主题">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="currentColor"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 00-1.41 0 .996.996 0 000 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 00-1.41 0 .996.996 0 000 1.41l1.06 1.06c.39.39 1.03.39 1.41 0a.996.996 0 000-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 000-1.41.996.996 0 00-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 000-1.41.996.996 0 00-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M12 3a9 9 0 109 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 01-4.4 2.26 5.403 5.403 0 01-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
    </button>

    <div class="search-overlay">
        <div class="logo-block">
            <svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1920" viewBox="0 0 1920 1920">
                <defs><clipPath id="clip-LOGO"><rect width="1920" height="1920"/></clipPath></defs>
                <g clip-path="url(#clip-LOGO)">
                    <g transform="translate(127.376 68.102)">
                        <rect class="logo-main" width="150" height="1100" transform="translate(952.628 148.113) rotate(60)"/>
                        <rect class="logo-main" width="150" height="747" transform="translate(503.802 1271.921) rotate(150)"/>
                        <rect class="logo-main" width="150" height="1400" transform="translate(1659.528 1356.548) rotate(150)"/>
                        <rect class="logo-main" width="150" height="1400" transform="translate(1511.65 516.523) rotate(60)"/>
                        <rect class="logo-main" width="150" height="747" transform="translate(1589.725 646.921) rotate(150)"/>
                        <rect class="logo-sub" width="150" height="458.837" rx="75" transform="translate(1104.114 1166.766) rotate(60)"/>
                    </g>
                </g>
            </svg>
        </div>

        <div class="search-box" id="sb">
            <input class="search-ipt" type="text" id="searchInput" autocomplete="off" placeholder="搜索...">
            <button class="search-btn" id="searchBtn" aria-label="搜索">
                <svg viewBox="0 0 1024 1024"><path d="M1024 981.333c0 23.467-19.2 42.667-42.667 42.667-12.8 0-23.467-4.267-29.867-12.8L697.6 757.333C622.933 817.067 529.067 853.333 426.667 853.333 192 853.333 0 661.333 0 426.667 0 192 192 0 426.667 0s426.667 192 426.667 426.667c0 102.4-36.267 196.267-96 270.933l253.867 253.867C1019.733 957.867 1024 968.533 1024 981.333zM426.667 85.333C238.933 85.333 85.333 238.933 85.333 426.667s153.6 341.333 341.333 341.333 341.333-153.6 341.333-341.333S614.4 85.333 426.667 85.333z"/></svg>
            </button>
        </div>

        <div class="pin-container" id="pin">
            <pin-item url="https://www.bilibili.com" title="BiliBili"></pin-item>
            <pin-item url="https://www.microsoft.com" title="Microsoft"></pin-item>
            <pin-item url="https://www.github.com" title="GitHub"></pin-item>
            <pin-item url="https://www.google.com" title="Google"></pin-item>
            <pin-item url="https://www.x.com" title="X"></pin-item>
            <pin-item url="https://aistudio.google.com" title="AIStudio"></pin-item>
            <pin-item url="https://harcicyang.github.io/sickof.html" title="发电"></pin-item>
        </div>
    </div>

    <script>
        var inp = document.getElementById("searchInput"),
            sb = document.getElementById("sb"),
            pin = document.getElementById("pin");
        function fadeAll() { sb.classList.add("fade"); pin.classList.add("fade"); }
        function goSearch() { fadeAll(); setTimeout(function() { location.href = "https://www.bing.com/search?q=" + encodeURIComponent(inp.value); }, 400); }
        inp.addEventListener("keypress", function(e) { if (e.key === "Enter") goSearch(); });
        document.getElementById("searchBtn").onclick = goSearch;
        pin.querySelectorAll("pin-item").forEach(function(p) { p.addEventListener("click", fadeAll); });
    </script>
    <script src="/resource/theme.js"></script>
</body>
</html>
