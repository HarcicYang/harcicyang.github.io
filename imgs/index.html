<!DOCTYPE html>
<html lang="zh" class="rcitrat-preview">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#e8ecf1" media="(prefers-color-scheme: light)">
    <title>图片集</title>
    <link rel="icon" type="image/svg+xml" href="/resource/favicon.svg">
    <link rel="stylesheet" href="/resource/theme.css?v=rcitrat-site-28">
    <style>
        .gallery-container { width: 100%; max-width: 700px; }

        .gallery-header {
            padding: 0 0 1rem;
            margin-bottom: 1rem;
        }
        .gallery-header h1 {
            font-size: var(--title-size, 1.5rem);
            font-weight: 700;
            text-align: left;
            color: var(--text-color);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1rem;
        }

        .gallery-item {
            display: block;
            background: var(--box-color);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            overflow: hidden;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
            will-change: transform;
            transition: transform var(--transition-normal), box-shadow var(--transition-normal);
        }
        .gallery-item:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-card-hover);
        }
        .gallery-item img { width: 100%; height: 200px; object-fit: cover; display: block; }

        /* Image Viewer (Lightbox) */
        .viewer-overlay {
            position: fixed; inset: 0; z-index: 2000;
            background: rgba(0, 0, 0, 0.9);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .viewer-overlay.open { opacity: 1; pointer-events: auto; }

        .viewer-image {
            max-width: 90vw; max-height: 85vh;
            border-radius: var(--radius-lg);
            object-fit: contain;
            transform: scale(0.9);
            transition: transform 0.3s ease;
            box-shadow: 0 0 60px rgba(56, 130, 235, 0.15);
        }
        .viewer-overlay.open .viewer-image { transform: scale(1); }

        .viewer-close {
            position: fixed; top: 1.2rem; right: 1.2rem; z-index: 2001;
            width: 44px; height: 44px; border-radius: 50%; border: 0;
            background: rgba(24, 25, 27, 0.7);
            color: rgba(255, 255, 255, 0.8); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.4rem;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: transform 0.2s, background 0.2s;
        }
        .viewer-close:hover { transform: scale(1.12); background: rgba(24, 25, 27, 0.9); }

        .viewer-nav {
            position: fixed; top: 50%; z-index: 2001;
            width: 48px; height: 48px; border-radius: 50%; border: 0;
            background: rgba(24, 25, 27, 0.7);
            color: rgba(255, 255, 255, 0.8); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            will-change: transform;
            transition: transform 0.2s, background 0.2s;
        }
        .viewer-nav:hover { transform: scale(1.12); background: rgba(24, 25, 27, 0.9); }
        .viewer-nav.prev { left: 1.2rem; transform: translateY(-50%); }
        .viewer-nav.next { right: 1.2rem; transform: translateY(-50%); }
        .viewer-nav.prev:hover { transform: translateY(-50%) scale(1.12); }
        .viewer-nav.next:hover { transform: translateY(-50%) scale(1.12); }

        .viewer-caption {
            position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
            z-index: 2001;
            padding: 0.5rem 1.25rem;
            background: rgba(24, 25, 27, 0.7);
            color: rgba(255, 255, 255, 0.8);
            border-radius: 9999px;
            font-size: 0.9rem;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        @media (max-width: 480px) {
            .gallery-grid { grid-template-columns: repeat(2, 1fr); gap: 0.65rem; }
            .gallery-item img { height: 150px; }
            .viewer-nav { width: 40px; height: 40px; }
            .viewer-close { width: 38px; height: 38px; }
        }
    </style>
    <link rel="stylesheet" href="/resource/rcitrat/tokens.css?v=rcitrat-site-28">
    <link rel="stylesheet" href="/resource/rcitrat/surfaces.css?v=rcitrat-site-28">
    <link rel="stylesheet" href="/resource/rcitrat/icons.css?v=rcitrat-site-28">
    <script src="/resource/rcitrat/color.js?v=rcitrat-site-28"></script>
</head>
<body>
    <a href="/" class="back-btn ic-host" title="返回首页">
        <hc-icon name="back"></hc-icon>
        首页
    </a>

    <button class="theme-toggle ic-host" id="themeToggle" aria-label="切换主题">
        <svg class="icon-sun" width="0" height="0" aria-hidden="true"></svg>
        <svg class="icon-moon" width="0" height="0" style="display:none" aria-hidden="true"></svg>
        <hc-icon name="theme"></hc-icon>
    </button>

    <div class="page-scroll">
    <div class="gallery-container">
        <div class="gallery-header"><h1>图片集</h1></div>
        <div class="gallery-grid" id="galleryGrid"></div>
    </div>
    </div>

    <div class="viewer-overlay" id="viewerOverlay">
        <button class="viewer-nav prev ic-host" id="viewerPrev" aria-label="上一张"><hc-icon name="prev"></hc-icon></button>
        <img class="viewer-image" id="viewerImage" src="" alt="">
        <button class="viewer-nav next ic-host" id="viewerNext" aria-label="下一张"><hc-icon name="next"></hc-icon></button>
        <button class="viewer-close ic-host" id="viewerClose" aria-label="关闭"><hc-icon name="close"></hc-icon></button>
        <div class="viewer-caption" id="viewerCaption"></div>
    </div>

    <script>
        var images = [
            { src: "IMG_7253.jpeg", name: "爱莉希雅" },
            { src: "IMG_7258.jpeg", name: "三月七" }
        ];

        var grid = document.getElementById("galleryGrid");
        images.forEach(function(img, i) {
            var item = document.createElement("a");
            item.className = "gallery-item";
            item.href = "#";
            item.setAttribute("data-index", i);
            item.innerHTML = '<img src="' + img.src + '" alt="' + img.name + '" loading="lazy">';
            item.addEventListener("click", function(e) { e.preventDefault(); openViewer(i); });
            grid.appendChild(item);
        });

        var overlay = document.getElementById("viewerOverlay"),
            viewerImg = document.getElementById("viewerImage"),
            viewerCaption = document.getElementById("viewerCaption"),
            currentIndex = 0;

        function openViewer(index) {
            currentIndex = index;
            viewerImg.src = images[index].src;
            viewerCaption.textContent = images[index].name;
            overlay.classList.add("open");
            document.body.style.overflow = "hidden";
        }

        function closeViewer() {
            overlay.classList.remove("open");
            document.body.style.overflow = "";
        }

        function navViewer(dir) {
            currentIndex = (currentIndex + dir + images.length) % images.length;
            viewerImg.src = images[currentIndex].src;
            viewerCaption.textContent = images[currentIndex].name;
        }

        document.getElementById("viewerClose").addEventListener("click", closeViewer);
        overlay.addEventListener("click", function(e) { if (e.target === overlay) closeViewer(); });
        document.getElementById("viewerPrev").addEventListener("click", function(e) { e.stopPropagation(); navViewer(-1); });
        document.getElementById("viewerNext").addEventListener("click", function(e) { e.stopPropagation(); navViewer(1); });

        document.addEventListener("keydown", function(e) {
            if (!overlay.classList.contains("open")) return;
            if (e.key === "Escape") closeViewer();
            if (e.key === "ArrowLeft") navViewer(-1);
            if (e.key === "ArrowRight") navViewer(1);
        });
    </script>
    <script src="/resource/rcitrat/icons.js?v=rcitrat-site-28"></script>
    <script src="/resource/rcitrat/site.js?v=rcitrat-site-28"></script>
    <script src="/resource/theme.js?v=rcitrat-site-28"></script>
</body>
</html>
