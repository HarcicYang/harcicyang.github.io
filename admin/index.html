<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Content Manager — Harcic's Blog</title>
    <link rel="icon" type="image/svg+xml" href="/resource/favicon.svg">
    <link rel="stylesheet" href="/resource/theme.css">
    <style>
        html, body { height: 100%; background: transparent !important; margin: 0; }
        body::before {
            content: "";
            position: fixed; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1; pointer-events: none;
            background: linear-gradient(var(--overlay), var(--overlay)), var(--bg-image) center / cover no-repeat;
        }

        #nc-root { height: 100%; }
        #nc-root > div { background: transparent !important; }

        /* ---- surfaces ---- */
        #nc-root header, #nc-root nav, #nc-root aside,
        [class*="Card"], [class*="Pane"], [class*="Panel"],
        [class*="Editor"], [class*="Preview"], [class*="Widget"],
        [class*="Frame"], [class*="ControlPane"], [class*="Sidebar"] {
            background: var(--box-color) !important;
            backdrop-filter: var(--glass-blur) !important;
            -webkit-backdrop-filter: var(--glass-blur) !important;
            border-radius: var(--radius-md) !important;
        }
        #nc-root [class*="Toolbar"] {
            background: var(--sub-box-color) !important;
            backdrop-filter: var(--glass-blur) !important;
            -webkit-backdrop-filter: var(--glass-blur) !important;
            border-radius: var(--radius-md) !important;
            border-bottom: 1px solid rgba(var(--primary-rgb), 0.08) !important;
        }

        /* ---- text ---- */
        #nc-root { color: var(--text-color) !important; }
        #nc-root a { color: var(--ac-btn-color) !important; }

        /* ---- buttons ---- */
        #nc-root button:not([class*="Toastify"]),
        #nc-root [class*="Button"],
        #nc-root [role="button"] {
            border-radius: var(--radius-pill) !important;
            background: var(--box-color) !important;
            color: var(--text-color) !important;
            border: 1px solid rgba(var(--primary-rgb), 0.15) !important;
        }
        #nc-root button:hover:not([class*="Toastify"]),
        #nc-root [class*="Button"]:hover {
            border-color: var(--ac-btn-color) !important;
            background: rgba(var(--primary-rgb), 0.1) !important;
        }
        #nc-root button[class*="primary"]:not([class*="Toastify"]),
        #nc-root button[class*="Primary"]:not([class*="Toastify"]),
        #nc-root [class*="Button"][class*="primary"],
        #nc-root [class*="Button"][class*="Primary"] {
            background: var(--ac-btn-color) !important;
            border-color: var(--ac-btn-color) !important;
            color: #fff !important;
            box-shadow: var(--shadow-btn) !important;
        }

        /* ---- inputs ---- */
        #nc-root input[type="text"], #nc-root input[type="search"],
        #nc-root input[type="email"], #nc-root input[type="url"],
        #nc-root select {
            border-radius: var(--radius-pill) !important;
            background: var(--sub-box-color) !important;
            color: var(--text-color) !important;
            border: 1px solid rgba(var(--primary-rgb), 0.15) !important;
            padding: 0.45rem 0.8rem !important;
            outline: none !important;
        }
        #nc-root textarea {
            border-radius: var(--radius-md) !important;
            background: var(--sub-box-color) !important;
            color: var(--text-color) !important;
            border: 1px solid rgba(var(--primary-rgb), 0.15) !important;
            padding: 0.6rem 0.8rem !important;
            outline: none !important;
        }
        #nc-root input:focus, #nc-root textarea:focus, #nc-root select:focus {
            border-color: var(--ac-btn-color) !important;
            box-shadow: 0 0 0 2px rgba(var(--primary-rgb), 0.2) !important;
        }
        #nc-root input::placeholder, #nc-root textarea::placeholder {
            color: var(--text-muted) !important;
        }

        /* ---- login ---- */
        #nc-root [class*="Login"] { background: transparent !important; }
        #nc-root [class*="LoginButton"], #nc-root [class*="loginButton"] {
            background: var(--ac-btn-color) !important;
            color: #fff !important;
            border-radius: var(--radius-pill) !important;
            padding: 0.7rem 2rem !important;
            box-shadow: var(--shadow-btn) !important;
            border: none !important;
        }

        /* ---- Toastify ---- */
        .Toastify__toast-container { z-index: 99999 !important; }
        .Toastify__toast {
            background: var(--sub-box-color) !important;
            backdrop-filter: var(--glass-blur) !important;
            -webkit-backdrop-filter: var(--glass-blur) !important;
            color: var(--text-color) !important;
            border-radius: var(--radius-md) !important;
            box-shadow: var(--shadow-card) !important;
            border: 1px solid rgba(var(--primary-rgb), 0.1) !important;
            padding: 0.5rem 1rem !important;
            min-height: auto !important;
        }
        .Toastify__toast-body { color: var(--text-color) !important; }
        .Toastify__progress-bar { background: var(--ac-btn-color) !important; }
        .Toastify__close-button { color: var(--text-secondary) !important; opacity: 0.6 !important; }

        /* ---- scrollbar ---- */
        #nc-root ::-webkit-scrollbar { width: 6px; height: 6px; }
        #nc-root ::-webkit-scrollbar-track { background: transparent; }
        #nc-root ::-webkit-scrollbar-thumb { background: var(--ac-btn-color); border-radius: 3px; }
    </style>
</head>
<body>
    <script src="/resource/theme.js"></script>
    <script src="https://unpkg.com/decap-cms@^3/dist/decap-cms.js"></script>
</body>
</html>
