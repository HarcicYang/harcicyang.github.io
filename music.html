<!DOCTYPE html>
<html lang="zh" class="rcitrat-preview">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#e8ecf1" media="(prefers-color-scheme: light)">
    <title>经典老歌送给你</title>
    <link rel="icon" type="image/svg+xml" href="/resource/favicon.svg">
    <link rel="stylesheet" href="/resource/theme.css?v=rcitrat-site-26">
    <style>
        body { flex-direction: column; justify-content: center; gap: 1.5rem; }
        .play-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.1rem;
            padding: 2.75rem 2.25rem;
            background: var(--sub-box-color);
            border-radius: var(--radius-lg);
            box-shadow: 0 0 12px 5px var(--box-shadow-color);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            cursor: pointer;
            text-align: center;
            transition: transform 0.2s;
        }
        .play-card:hover { transform: translateY(-4px); }
        .play-card.playing { background: var(--box-color); }
        .play-card .play-icon { width: 100px; height: 100px; font-size: 100px; line-height: 1; color: var(--hc-accent); transition: transform 0.2s; }
        .play-card:hover .play-icon { transform: scale(1.08); }
        .play-text { font-size: 1.3rem; font-weight: 600; }
        .play-sub { font-size: 0.92rem; line-height: 1.5; opacity: 0.65; }
        @media (max-width: 480px) {
            .play-card { padding: 2rem 1.5rem; }
            .play-card .play-icon { width: 80px; height: 80px; font-size: 80px; }
        }
    </style>
    <link rel="stylesheet" href="/resource/rcitrat/tokens.css?v=rcitrat-site-26">
    <link rel="stylesheet" href="/resource/rcitrat/surfaces.css?v=rcitrat-site-26">
    <link rel="stylesheet" href="/resource/rcitrat/icons.css?v=rcitrat-site-26">
    <script src="/resource/rcitrat/color.js?v=rcitrat-site-26"></script>
</head>
<body>
    <a href="/" class="back-btn ic-host" title="返回首页">
        <hc-icon name="back"></hc-icon>
        首页
    </a>
    <button class="theme-toggle ic-host" id="themeToggle" aria-label="切换主题">
        <svg class="icon-sun" width="0" height="0" aria-hidden="true"></svg>
        <svg class="icon-moon" width="0" height="0" style="display:none" aria-hidden="true"></svg>
        <hc-icon name="theme"></hc-icon>
    </button>

    <div class="play-card" id="play">
        <hc-icon class="play-icon ic-host" name="play"></hc-icon>
        <span class="play-text" id="text">点击播放</span>
        <span class="play-sub">经典老歌送给你</span>
    </div>

    <script>
        var c = false;
        document.getElementById("play").onclick = function() {
            if (c) return; c = true;
            this.classList.add("playing");
            document.getElementById("text").textContent = "你被骗了";
            new Audio("http://other-player-ri01-sycdn.kuwo.cn/acdcdc0646b8ef8ab358d5911221e9df/64da192f/resource/n2/55/73/2708435384.mp3").play();
        };    </script>
    <script src="/resource/rcitrat/icons.js?v=rcitrat-site-26"></script>
    <script src="/resource/rcitrat/site.js?v=rcitrat-site-26"></script>
    <script src="/resource/theme.js?v=rcitrat-site-26"></script>
</body>
</html>
