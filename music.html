<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#e8ecf1" media="(prefers-color-scheme: light)">
    <title>经典老歌送给你</title>
    <link rel="icon" type="image/svg+xml" href="/resource/favicon.svg">
    <link rel="stylesheet" href="/resource/theme.css">
    <style>
        body { flex-direction: column; justify-content: center; gap: 1.5rem; }
        .play-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            padding: 2.5rem 2rem;
            background: var(--sub-box-color);
            border-radius: var(--radius-lg);
            box-shadow: 0 0 12px 5px var(--box-shadow-color);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            cursor: pointer;
            text-align: center;
            transition: transform 0.2s;
        }
        .play-card:hover { transform: translateY(-4px); }
        .play-card.playing { background: var(--box-color); }
        .play-card .play-icon { width: 100px; height: 100px; transition: transform 0.2s; }
        .play-card:hover .play-icon { transform: scale(1.08); }
        .play-text { font-size: 1.2rem; font-weight: 600; }
        .play-sub { font-size: 0.85rem; opacity: 0.6; }
        @media (max-width: 480px) {
            .play-card { padding: 2rem 1.5rem; }
            .play-card .play-icon { width: 80px; height: 80px; }
        }
    </style>
</head>
<body>
    <a href="/" class="back-btn" title="返回首页">

    </button>

    <div class="play-card" id="play">

        <span class="play-text" id="text">点击播放</span>
        <span class="play-sub">经典老歌送给你</span>

        document.getElementById("play").onclick = function() {
            if (c) return; c = true;
            this.classList.add("playing");
            document.getElementById("text").textContent = "你被骗了";
            new Audio("http://other-player-ri01-sycdn.kuwo.cn/acdcdc0646b8ef8ab358d5911221e9df/64da192f/resource/n2/55/73/2708435384.mp3").play();
