<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#e8ecf1" media="(prefers-color-scheme: light)">
    <title>{{ page.title }} — Harcic's Blog</title>
    <link rel="icon" type="image/svg+xml" href="/resource/favicon.svg">
    <link rel="stylesheet" href="/resource/theme.css">
    <link rel="stylesheet" href="/resource/syntax.css">
    <style>
        .page-scroll { overflow-x: hidden; }

        .post-reading {
            width: 100%;
            max-width: 1060px;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            gap: 1.5rem;
        }
        .post-container {
            flex: 1;
            min-width: 0;
            width: 100%;
            max-width: 780px;
        }
        .post-header {
            margin-bottom: 2rem;
        }
        .post-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        .post-meta {
            font-size: 0.85rem;
            opacity: 0.55;
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem 1rem;
            align-items: center;
        }
        .post-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
        }
        .post-tag {
            padding: 0.2rem 0.7rem;
            border-radius: var(--radius-pill);
            background: rgba(var(--primary-rgb), 0.12);
            color: var(--ac-btn-color);
            font-size: 0.78rem;
            font-weight: 500;
        }
        .post-top-actions {
            position: fixed;
            top: 1rem;
            left: 1rem;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 0.85rem;
        }
        .post-top-actions .back-btn,
        .post-top-actions .toc-toggle {
            position: static;
            top: auto;
            left: auto;
        }
        .toc-toggle {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            padding: 0.42rem 0.95rem;
            border: 0;
            border-radius: var(--radius-pill);
            background: var(--box-color);
            color: var(--text-color);
            font-size: 0.82rem;
            font-weight: 500;
            cursor: pointer;
            box-shadow: var(--shadow-card);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            transition: color var(--transition-fast), box-shadow var(--transition-fast);
        }
        .toc-toggle[hidden] { display: none; }
        .toc-toggle:hover {
            color: var(--ac-btn-color);
            box-shadow: var(--shadow-card-hover);
        }
        .toc-toggle-icon { transition: transform var(--transition-fast); }
        .toc-toggle[aria-expanded="true"] .toc-toggle-icon { transform: rotate(180deg); }
        .post-toc {
            flex: 0 0 228px;
            position: sticky;
            top: 1rem;
            max-height: calc(100vh - 4rem);
            overflow-y: auto;
            padding: 1rem 0.8rem;
            border-radius: var(--radius-md);
            background: var(--box-color);
            box-shadow: var(--shadow-card);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid rgba(var(--primary-rgb), 0.08);
            scrollbar-color: var(--ac-btn-color) transparent;
            scrollbar-width: thin;
        }
        .post-toc:empty { display: none; }
        .post-toc.is-collapsed { display: none; }
        .post-toc-title {
            font-size: 0.92rem;
            font-weight: 700;
            color: var(--text-color);
            margin-bottom: 0;
        }
        .post-toc-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            margin-bottom: 0.7rem;
        }
        .toc-close {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 26px;
            height: 26px;
            padding: 0;
            border: 0;
            border-radius: var(--radius-pill);
            background: rgba(var(--primary-rgb), 0.08);
            color: var(--text-secondary);
            cursor: pointer;
            transition: color var(--transition-fast), background var(--transition-fast);
        }
        .toc-close:hover {
            color: var(--ac-btn-color);
            background: rgba(var(--primary-rgb), 0.16);
        }
        .post-toc-list {
            list-style: none;
            margin: 0;
            padding: 0;
        }
        .post-toc-item { margin: 0.15rem 0; }
        .post-toc-item a {
            display: block;
            padding: 0.28rem 0.6rem 0.28rem 0.5rem;
            border-left: 2px solid transparent;
            color: var(--text-secondary);
            font-size: 0.87rem;
            line-height: 1.4;
            text-decoration: none;
            transition: color var(--transition-fast), border-color var(--transition-fast);
        }
        .post-toc-item a:hover {
            color: var(--ac-btn-color);
            border-left-color: var(--ac-btn-color);
        }
        .post-toc-h3 a { padding-left: 1.05rem; font-size: 0.84rem; }
        .post-toc-h4 a { padding-left: 1.5rem; font-size: 0.82rem; }
        .post-toc-h5 a { padding-left: 1.95rem; font-size: 0.8rem; }
        .post-toc-h6 a { padding-left: 2.4rem; font-size: 0.78rem; }
        .post-body {
            min-width: 0;
            background: var(--box-color);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            padding: 2rem 2.2rem;
            margin-bottom: 2rem;
            line-height: 1.85;
            font-size: 1rem;
        }
        .post-body h1, .post-body h2, .post-body h3, .post-body h4, .post-body h5, .post-body h6 {
            scroll-margin-top: 1.4rem;
        }
        .post-body h1 { font-size: 1.7rem; margin: 1.8rem 0 0.8rem; }
        .post-body h2 { font-size: 1.4rem; margin: 1.6rem 0 0.7rem; }
        .post-body h3 { font-size: 1.15rem; margin: 1.3rem 0 0.6rem; }
        .post-body p { margin-bottom: 0.9rem; }
        .post-body p,
        .post-body li,
        .post-body blockquote,
        .post-body h1, .post-body h2, .post-body h3, .post-body h4, .post-body h5, .post-body h6,
        .post-body td, .post-body th,
        .post-body summary {
            overflow-wrap: anywhere;
        }
        .post-body ul, .post-body ol { padding-left: 1.5rem; margin-bottom: 0.9rem; }
        .post-body li { margin-bottom: 0.3rem; }
        .post-body a { color: var(--ac-btn-color); text-decoration: underline; text-underline-offset: 2px; }
        .post-body blockquote {
            border-left: 3px solid var(--ac-btn-color);
            padding: 0.4rem 1rem;
            margin: 1rem 0;
            background: rgba(var(--primary-rgb), 0.06);
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            opacity: 0.85;
        }
        .post-body code {
            background: rgba(var(--primary-rgb), 0.1);
            padding: 0.15rem 0.4rem;
            border-radius: 4px;
            font-size: 0.9em;
            font-family: "Cascadia Code", "Fira Code", "JetBrains Mono", monospace;
        }
        .post-body pre {
            background: rgba(0,0,0,0.35);
            border-radius: var(--radius-md);
            padding: 1rem 1.2rem;
            overflow-x: auto;
            margin: 1rem 0;
            border: 1px solid rgba(var(--primary-rgb), 0.1);
        }
        .post-body pre code {
            background: none;
            padding: 0;
            font-size: 0.88rem;
        }
        .post-body img {
            max-width: 100%;
            border-radius: var(--radius-md);
        }
        .post-body hr {
            border: none;
            height: 1px;
            background: rgba(var(--primary-rgb), 0.15);
            margin: 1.5rem 0;
        }
        .post-body details {
            margin: 1rem 0;
            padding: 0.9rem 1.1rem;
            border: 1px solid rgba(var(--primary-rgb), 0.16);
            border-left: 3px solid rgba(var(--primary-rgb), 0.65);
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            background: rgba(var(--primary-rgb), 0.05);
        }
        .post-body summary {
            cursor: pointer;
            font-weight: 600;
            color: var(--text-color);
            list-style: none;
        }
        .post-body summary::-webkit-details-marker { display: none; }
        .post-body summary::before {
            content: "▶";
            display: inline-block;
            font-size: 0.72em;
            margin-right: 0.55rem;
            color: var(--ac-btn-color);
            transition: transform var(--transition-fast);
        }
        .post-body details[open] > summary::before { transform: rotate(90deg); }
        .post-body details[open] > summary { margin-bottom: 0.7rem; }
        .post-body details > * + * { margin-top: 0.35rem; }
        .post-body details > :last-child { margin-bottom: 0; }

        .post-body .markdown-alert {
            margin: 1rem 0;
            padding: 0.85rem 1rem 0.85rem 1.1rem;
            border-left: 3px solid var(--alert-color, var(--ac-btn-color));
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            background: var(--alert-bg, rgba(var(--primary-rgb), 0.06));
        }
        .post-body .markdown-alert-title {
            font-weight: 700;
            margin-bottom: 0.4rem;
            color: var(--alert-color, var(--ac-btn-color));
        }
        .post-body .markdown-alert p { margin-bottom: 0.4rem; }
        .post-body .markdown-alert p:last-child { margin-bottom: 0; }
        .markdown-alert-note { --alert-color: #5eb1ff; --alert-bg: rgba(70, 145, 255, 0.1); }
        .markdown-alert-tip { --alert-color: #58d697; --alert-bg: rgba(50, 200, 130, 0.1); }
        .markdown-alert-important { --alert-color: #b58cff; --alert-bg: rgba(135, 95, 245, 0.12); }
        .markdown-alert-warning { --alert-color: #f0b052; --alert-bg: rgba(225, 165, 70, 0.12); }
        .markdown-alert-caution { --alert-color: #f07b6b; --alert-bg: rgba(235, 100, 80, 0.12); }

        .post-body table {
            width: 100%;
            border-collapse: collapse;
            margin: 1rem 0;
            font-size: 0.95rem;
        }
        .post-body th, .post-body td {
            border: 1px solid rgba(var(--primary-rgb), 0.16);
            padding: 0.5rem 0.75rem;
            text-align: left;
        }
        .post-body th { background: rgba(var(--primary-rgb), 0.08); font-weight: 600; }

        .post-body .mermaid {
            margin: 1rem 0;
            padding: 0.75rem 0.25rem;
            display: flex;
            justify-content: center;
            overflow-x: auto;
            background: rgba(var(--primary-rgb), 0.04);
            border-radius: var(--radius-sm);
        }
        .post-body .mermaid svg { max-width: 100%; height: auto; }
        .post-body .mermaid-error {
            justify-content: flex-start;
            font-family: "Cascadia Code", "Fira Code", "JetBrains Mono", monospace;
            font-size: 0.85rem;
            color: #f07b6b;
            white-space: pre-wrap;
        }

        .comments-section {
            margin-top: 1rem;
            margin-bottom: 2rem;
            padding: 1.5rem 2rem;
            background: var(--box-color);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid rgba(var(--primary-rgb), 0.06);
        }
        .comments-section .giscus {
            margin-top: 0.5rem;
        }

        @media (max-width: 1080px) {
            .toc-close { display: none; }
            .post-toc {
                position: fixed;
                top: 4.25rem;
                left: 0.75rem;
                flex: none;
                width: min(280px, calc(100vw - 1.5rem));
                max-height: calc(100vh - 5.5rem);
                z-index: 950;
                margin: 0;
                opacity: 0;
                visibility: hidden;
                transform: translateX(calc(-100% - 1.5rem));
                transition: opacity var(--transition-normal), transform var(--transition-normal), visibility var(--transition-normal), box-shadow var(--transition-normal);
            }
            .post-toc.is-open {
                opacity: 1;
                visibility: visible;
                transform: translateX(0);
                box-shadow: 0 14px 38px 8px rgba(0, 0, 0, 0.55), 0 0 46px rgba(var(--primary-rgb), 0.22);
            }
        }

        @media (min-width: 1081px) {
            .toc-toggle { display: none; }
            body:has(.post-toc.is-collapsed) .toc-toggle { display: inline-flex; }
        }

        @media (max-width: 768px) {
            .post-top-actions { top: 0.75rem; left: 0.75rem; gap: 0.7rem; }
            .post-body { padding: 1.25rem 1.25rem; }
            .post-title { font-size: 1.5rem; }
            .comments-section { padding: 1rem 1.25rem; }
        }
    </style>
</head>
<body>
    <div class="post-top-actions">
        <a href="/blog/" class="back-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            博客首页
        </a>

        <button class="toc-toggle" id="tocToggle" type="button" aria-controls="post-toc" aria-expanded="false" hidden>
            <span>目录</span>
            <svg class="toc-toggle-icon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9.29 6.71a.996.996 0 000 1.41L13.17 12l-3.88 3.88a.996.996 0 101.41 1.41l4.59-4.58a1 1 0 000-1.42L10.7 6.7a.996.996 0 00-1.41.01z"/></svg>
        </button>
    </div>

    <button class="theme-toggle" id="themeToggle" aria-label="切换主题">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="currentColor"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 00-1.41 0 .996.996 0 000 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 00-1.41 0 .996.996 0 000 1.41l1.06 1.06c.39.39 1.03.39 1.41 0a.996.996 0 000-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 000-1.41.996.996 0 00-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 000-1.41.996.996 0 00-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M12 3a9 9 0 109 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 01-4.4 2.26 5.403 5.403 0 01-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
    </button>

    <div class="page-scroll">
    <div class="post-reading">
    <aside class="post-toc" id="post-toc" aria-label="目录"></aside>
    <div class="post-container">
        <header class="post-header">
            <h1 class="post-title">{{ page.title }}</h1>
            <div class="post-meta">
                <span>{{ page.date | date: "%Y 年 %m 月 %d 日" }}</span>
                {% if page.tags %}
                <span class="post-tags">
                    {% for tag in page.tags %}
                    <span class="post-tag">{{ tag }}</span>
                    {% endfor %}
                </span>
                {% endif %}
            </div>
        </header>

        <article class="post-body fade-in">
            {{ content }}
        </article>

        <section class="comments-section fade-in">
            {% include comments.html %}
        </section>
    </div>
    </div>
    </div>

    <script src="/resource/theme.js"></script>
    <script type="module" src="/resource/blog-renderer.js"></script>
</body>
</html>
