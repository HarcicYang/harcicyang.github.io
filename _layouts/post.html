<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#e8ecf1" media="(prefers-color-scheme: light)">
    <title>{{ page.title }} — Harcic's Blog</title>
    <link rel="icon" type="image/svg+xml" href="/resource/favicon.svg">
    <link rel="stylesheet" href="/resource/theme.css">
    <link rel="stylesheet" href="/resource/syntax.css">
    <style>
        .post-container {
            width: 100%;
            max-width: 780px;
        }
        .post-header {
            margin-bottom: 2rem;
        }
        .post-title {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        .post-meta {
            font-size: 0.85rem;
            opacity: 0.55;
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem 1rem;
            align-items: center;
        }
        .post-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
        }
        .post-tag {
            padding: 0.2rem 0.7rem;
            border-radius: var(--radius-pill);
            background: rgba(var(--primary-rgb), 0.12);
            color: var(--ac-btn-color);
            font-size: 0.78rem;
            font-weight: 500;
        }
        .post-body {
            background: var(--box-color);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            padding: 2rem 2.2rem;
            margin-bottom: 2rem;
            line-height: 1.85;
            font-size: 1rem;
        }
        .post-body h1 { font-size: 1.7rem; margin: 1.8rem 0 0.8rem; }
        .post-body h2 { font-size: 1.4rem; margin: 1.6rem 0 0.7rem; }
        .post-body h3 { font-size: 1.15rem; margin: 1.3rem 0 0.6rem; }
        .post-body p { margin-bottom: 0.9rem; }
        .post-body ul, .post-body ol { padding-left: 1.5rem; margin-bottom: 0.9rem; }
        .post-body li { margin-bottom: 0.3rem; }
        .post-body a { color: var(--ac-btn-color); text-decoration: underline; text-underline-offset: 2px; }
        .post-body blockquote {
            border-left: 3px solid var(--ac-btn-color);
            padding: 0.4rem 1rem;
            margin: 1rem 0;
            background: rgba(var(--primary-rgb), 0.06);
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
            opacity: 0.85;
        }
        .post-body code {
            background: rgba(var(--primary-rgb), 0.1);
            padding: 0.15rem 0.4rem;
            border-radius: 4px;
            font-size: 0.9em;
            font-family: "Cascadia Code", "Fira Code", "JetBrains Mono", monospace;
        }
        .post-body pre {
            background: rgba(0,0,0,0.35);
            border-radius: var(--radius-md);
            padding: 1rem 1.2rem;
            overflow-x: auto;
            margin: 1rem 0;
            border: 1px solid rgba(var(--primary-rgb), 0.1);
        }
        .post-body pre code {
            background: none;
            padding: 0;
            font-size: 0.88rem;
        }
        .post-body img {
            max-width: 100%;
            border-radius: var(--radius-md);
        }
        .post-body hr {
            border: none;
            height: 1px;
            background: rgba(var(--primary-rgb), 0.15);
            margin: 1.5rem 0;
        }

        .comments-section {
            background: var(--box-color);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            padding: 1.5rem 2rem;
            margin-bottom: 2rem;
        }

        @media (max-width: 768px) {
            .post-body { padding: 1.25rem 1.25rem; }
            .post-title { font-size: 1.5rem; }
            .comments-section { padding: 1rem 1.25rem; }
        }
    </style>
</head>
<body>
    <a href="/blog/" class="back-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        博客首页
    </a>

    <button class="theme-toggle" id="themeToggle" aria-label="切换主题">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="currentColor"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58a.996.996 0 00-1.41 0 .996.996 0 000 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37a.996.996 0 00-1.41 0 .996.996 0 000 1.41l1.06 1.06c.39.39 1.03.39 1.41 0a.996.996 0 000-1.41l-1.06-1.06zm1.06-10.96a.996.996 0 000-1.41.996.996 0 00-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36a.996.996 0 000-1.41.996.996 0 00-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M12 3a9 9 0 109 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 01-4.4 2.26 5.403 5.403 0 01-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg>
    </button>

    <div class="page-scroll">
    <div class="post-container">
        <header class="post-header">
            <h1 class="post-title">{{ page.title }}</h1>
            <div class="post-meta">
                <span>{{ page.date | date: "%Y 年 %m 月 %d 日" }}</span>
                {% if page.tags %}
                <span class="post-tags">
                    {% for tag in page.tags %}
                    <span class="post-tag">{{ tag }}</span>
                    {% endfor %}
                </span>
                {% endif %}
            </div>
        </header>

        <article class="post-body fade-in">
            {{ content }}
        </article>

        <section class="comments-section fade-in">
            {% include comments.html %}
        </section>
    </div>
    </div>

    <script src="/resource/theme.js"></script>
</body>
</html>
